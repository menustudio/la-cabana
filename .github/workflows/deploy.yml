name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # data/menu.js and assets/dishes/ are built locally (tools/build.py needs the
      # cut-out photos, which are not in git) — here we only collect the public files
      - name: Assemble site
        run: |
          mkdir -p dist/data
          cp -r index.html manifest.json robots.txt sitemap.xml sw.js css js assets dist/
          cp data/menu.js dist/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
